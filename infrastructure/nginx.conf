# Nginx Load Balancer Configuration for Learning Tracker
# This configuration distributes traffic across multiple backend instances

upstream learning_tracker_backend {
    # Load balancing method: round-robin (default)
    # Other options: least_conn (least connections), ip_hash (sticky sessions)
    
    # Backend server instances
    server localhost:5500 weight=1 max_fails=3 fail_timeout=30s;
    server localhost:5501 weight=1 max_fails=3 fail_timeout=30s;
    server localhost:5502 weight=1 max_fails=3 fail_timeout=30s;
    
    # Health check configuration (requires nginx-plus or healthcheck module)
    # keepalive 32;
}

# Frontend upstream (if needed for SSR or API proxy)
upstream learning_tracker_frontend {
    server localhost:3500;
}

server {
    listen 80;
    server_name learning-tracker.local;
    
    # Logging
    access_log /var/log/nginx/learning-tracker-access.log;
    error_log /var/log/nginx/learning-tracker-error.log;
    
    # Client body size limit
    client_max_body_size 10M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    
    # Frontend static files and API proxy
    location / {
        proxy_pass http://learning_tracker_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
    
    # Backend API endpoints with load balancing
    location /api/ {
        # Remove /api prefix when forwarding to backend
        rewrite ^/api/(.*)$ /$1 break;
        
        proxy_pass http://learning_tracker_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Retry configuration
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Status endpoint (requires stub_status module)
    # location /nginx_status {
    #     stub_status on;
    #     access_log off;
    #     allow 127.0.0.1;
    #     deny all;
    # }
}

