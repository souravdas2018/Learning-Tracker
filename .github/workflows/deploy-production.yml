name: Deploy to Production (EC2)

on:
  push:
    branches:
      - production

permissions:
  contents: read

env:
  # default Node version used on the runner and suggested for server
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend + Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Lint / Smoke-test backend (optional)
        working-directory: ./backend
        run: |
          # No build step for backend in this repo; run a quick node version check
          node -v

      - name: Create deploy artifacts
        run: |
          mkdir -p artifacts
          tar -C frontend -czf artifacts/frontend.tar.gz .
          tar -C backend -czf artifacts/backend.tar.gz .

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy artifacts to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          scp -i ~/.ssh/deploy_key -P $SSH_PORT artifacts/frontend.tar.gz $SSH_USER@$SSH_HOST:/tmp/frontend.tar.gz
          scp -i ~/.ssh/deploy_key -P $SSH_PORT artifacts/backend.tar.gz $SSH_USER@$SSH_HOST:/tmp/backend.tar.gz

      - name: Remote deploy (extract, install, restart with pm2)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          TARGET_FRONTEND="$DEPLOY_PATH/frontend"
          TARGET_BACKEND="$DEPLOY_PATH/backend"

          ssh -i ~/.ssh/deploy_key -p $SSH_PORT $SSH_USER@$SSH_HOST bash -s <<'REMOTE'
          set -e
          mkdir -p "$TARGET_FRONTEND" "$TARGET_BACKEND"

          # Frontend
          tar -xzf /tmp/frontend.tar.gz -C "$TARGET_FRONTEND"
          cd "$TARGET_FRONTEND"
          # ensure pm2 is available
          if ! command -v pm2 >/dev/null 2>&1; then
            npm install -g pm2
          fi
          npm ci --production
          npm run build
          # start or restart the Next.js app via npm start
          if pm2 describe frontend >/dev/null 2>&1; then
            pm2 restart frontend || true
          else
            pm2 start npm --name frontend -- start --prefix "$TARGET_FRONTEND"
          fi

          # Backend
          tar -xzf /tmp/backend.tar.gz -C "$TARGET_BACKEND"
          cd "$TARGET_BACKEND"
          if ! command -v pm2 >/dev/null 2>&1; then
            npm install -g pm2
          fi
          npm ci --production
          # start or restart backend using npm start
          if pm2 describe backend >/dev/null 2>&1; then
            pm2 restart backend || true
          else
            pm2 start npm --name backend -- start --prefix "$TARGET_BACKEND"
          fi

          # Optional: cleanup
          rm -f /tmp/frontend.tar.gz /tmp/backend.tar.gz
          pm2 save
          REMOTE

      - name: Post-deploy notice
        run: echo "Deploy completed to ${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}"

    # required secrets:
    # - SSH_PRIVATE_KEY: contents of the private key that can SSH to the EC2 instance
    # - SSH_HOST: public IP or DNS of EC2
    # - SSH_USER: user (ec2-user / ubuntu / admin ...)
    # - SSH_PORT: (optional) port, default 22
    # - DEPLOY_PATH: path on the server where apps should be deployed (e.g. /var/www/learning-tracker)
