name: Deploy to Production (EC2)

on:
  push:
    branches:
      - production

permissions:
  contents: read

env:
  # default Node version used on the runner and suggested for server
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend + Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Lint / Smoke-test backend (optional)
        working-directory: ./backend
        run: |
          # No build step for backend in this repo; run a quick node version check
          node -v

      - name: Create deploy bundle (docker-compose)
        run: |
          mkdir -p artifacts
          # include docker-compose and service folders (Dockerfiles should be present)
          tar -czf artifacts/deploy.tar.gz docker-compose.yml frontend backend

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy bundle to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          scp -i ~/.ssh/deploy_key -P $SSH_PORT artifacts/deploy.tar.gz $SSH_USER@$SSH_HOST:/tmp/deploy.tar.gz

      - name: Remote deploy via Docker Compose
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key -p $SSH_PORT $SSH_USER@$SSH_HOST bash -s <<'REMOTE'
          set -e
          mkdir -p "$DEPLOY_PATH"
          tar -xzf /tmp/deploy.tar.gz -C "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"

          # Ensure Docker and docker-compose are available
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl gnupg lsb-release
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io
          fi

          if ! command -v docker-compose >/dev/null 2>&1; then
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
          fi

          # Run docker-compose build and bring up containers
          sudo docker-compose -f docker-compose.yml up -d --build

          # cleanup
          rm -f /tmp/deploy.tar.gz
          REMOTE

      - name: Post-deploy notice
        run: echo "Docker Compose deploy completed to ${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}"

    # required secrets:
    # - SSH_PRIVATE_KEY: contents of the private key that can SSH to the EC2 instance
    # - SSH_HOST: public IP or DNS of EC2
    # - SSH_USER: user (ec2-user / ubuntu / admin ...)
    # - SSH_PORT: (optional) port, default 22
    # - DEPLOY_PATH: path on the server where apps should be deployed (e.g. /var/www/learning-tracker)
