name: Run Tests

on:
  push:
    branches:
      - testing
  pull_request:
    branches:
      - testing

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install
      
      - name: Install test dependencies
        working-directory: ./test-case/backend
        run: npm install
      
      - name: Run backend tests
        working-directory: ./test-case/backend
        run: npm test -- --passWithNoTests
        env:
          JWT_SECRET: test-jwt-secret-key
          NODE_ENV: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-key' }}
          FRONTEND_URL: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5500

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps || npm install
      
      - name: Install test dependencies
        working-directory: ./test-case/frontend
        run: npm install --legacy-peer-deps || npm install
      
      - name: Run frontend tests
        working-directory: ./test-case/frontend
        run: npm test -- --passWithNoTests
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5500

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test-backend.result }}" != "success" ] || [ "${{ needs.test-frontend.result }}" != "success" ]; then
            echo "Some tests failed"
            exit 1
          else
            echo "All tests passed!"
          fi
